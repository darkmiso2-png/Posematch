<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoseMatch</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/hub.css" />
    <link rel="stylesheet" href="./styles/hubCards.css" />
    <script type="importmap">
      {
        "imports": {
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" style="padding: 12px 14px 0">
        <div class="brand-pill">PoseMatch</div>
        <div class="status-pill">
          <span class="dot" id="mp-status-dot"></span>
          <span id="mp-status-text">Загрузка ИИ...</span>
        </div>
      </header>

      <section id="screen-hub" class="screen active">
        <div id="hub-notice" class="hub-notice" role="status" aria-live="polite" hidden>
          <span id="hub-notice-text" class="hub-notice-text"></span>
          <button
            id="hub-notice-close"
            class="hub-notice-close"
            type="button"
            aria-label="Закрыть уведомление"
          >
            ×
          </button>
        </div>

        <div id="hub-dropzone" class="hub-dropzone" tabindex="0">
          <div class="hub-dropzone-head">
            <span class="hub-dropzone-title">Референс позы</span>
            <span class="hub-dropzone-sub">
              Выберите фото, перетащите его сюда или вставьте через Ctrl+V
            </span>
          </div>
          <div id="hub-upload-status" class="hub-upload-status" hidden>
            <span class="hub-spinner" aria-hidden="true"></span>
            <span id="hub-upload-status-text">Анализ позы на фото...</span>
          </div>
          <div class="row-2">
            <button id="hub-btn-upload" class="btn btn-primary" type="button">
              Загрузить фото
            </button>
            <button id="hub-btn-record" class="btn" type="button">Запись позы 3с</button>
          </div>
          <input id="hub-file-input" type="file" accept="image/*" hidden />
        </div>

        <div class="card hub-actions-card">
          <div id="hub-active-summary" class="hub-active-ref">
            <img id="hub-active-thumb" class="hub-active-thumb" alt="Активный эталон" />
            <div class="hub-active-info">
              <span class="hub-active-label">Активный эталон</span>
              <strong id="hub-active-name" class="hub-active-name">Не выбран</strong>
            </div>
            <span id="hub-active-badge" class="hub-source-pill">Пресет</span>
          </div>
          <div class="row-2">
            <button id="hub-btn-shoot" class="btn btn-shoot" type="button">К съемке</button>
            <button id="hub-btn-calib" class="btn" type="button">Калибровка</button>
          </div>
          <button id="hub-btn-gallery" class="btn hub-btn-gallery" type="button">
            <span>Галерея дублей</span>
            <span id="hub-gallery-count" class="hub-count-badge">0</span>
          </button>
        </div>

        <div class="filter-row hub-filter-row" id="hub-filter-row">
          <button class="btn hub-filter-btn" data-filter="all" type="button">Все</button>
          <button class="btn hub-filter-btn" data-filter="portrait" type="button">Портрет</button>
          <button class="btn hub-filter-btn" data-filter="fullbody" type="button">Рост</button>
          <button class="btn hub-filter-btn" data-filter="dynamic" type="button">Динамика</button>
          <button class="btn hub-filter-btn" data-filter="saved" type="button">
            Мои <span id="hub-saved-count" class="hub-filter-count">0</span>
          </button>
        </div>

        <div id="hub-preset-grid" class="preset-grid"></div>
      </section>

      <section id="screen-calibration" class="screen" hidden>
        <div id="calib-banner" class="status-pill">Калибровка позы</div>
        <div class="calib-canvas-wrap"><canvas id="calib-canvas"></canvas></div>
        <p id="calib-info-label" class="muted-note">Перетащите сустав или 2×тап для вкл/выкл</p>
        <div class="row-2">
          <button id="calib-btn-restore" class="btn" type="button">Скрытые точки: 0</button>
          <button id="calib-btn-reset" class="btn" type="button">Сброс</button>
        </div>
        <div class="row-2">
          <button id="calib-btn-mirror" class="btn" type="button">Отзеркалить</button>
          <label class="status-pill" style="justify-content: center">
            <input id="calib-save-lib" type="checkbox" checked /> Сохранить
          </label>
        </div>
        <div class="row-2">
          <button id="calib-btn-cancel" class="btn" type="button">Назад</button>
          <button id="calib-btn-confirm" class="btn btn-primary" type="button">Подтвердить</button>
        </div>
      </section>

      <section id="screen-camera" class="screen" hidden>
        <div class="viewport-box">
          <video id="webcam" autoplay playsinline muted></video>
          <canvas id="overlay-canvas"></canvas>
          <canvas id="ref-mini-canvas" class="ref-mini" width="72" height="96"></canvas>
          <div id="countdown-overlay" class="countdown-badge">3</div>
          <div id="shutter-flash" class="shutter-flash"></div>
          <div class="hud-bar">
            <span id="hud-score" class="hud-score">0%</span>
            <div style="flex: 1">
              <div id="hud-hint" class="hud-hint">Встаньте в кадр</div>
              <div
                style="
                  height: 4px;
                  background: rgba(255, 255, 255, 0.12);
                  border-radius: 4px;
                  margin-top: 4px;
                "
              >
                <div
                  id="hud-hold-fill"
                  style="
                    height: 100%;
                    width: 0%;
                    background: var(--accent-green);
                    border-radius: 4px;
                  "
                ></div>
              </div>
            </div>
          </div>
          <div
            id="camera-fallback"
            class="hud-bar"
            style="top: 50%; bottom: auto; transform: translateY(-50%); flex-direction: column"
            hidden
          >
            <span id="camera-error-msg" class="muted-note">Камера не активна</span>
            <button id="btn-retry-cam" class="btn btn-primary" type="button">Повторить</button>
          </div>
        </div>
        <div class="card">
          <div class="row-2">
            <button id="toggle-attach" class="btn" type="button">К телу</button>
            <button id="toggle-mirror" class="btn" type="button">Зеркало</button>
            <button id="toggle-parktronic" class="btn" type="button">Парктроник</button>
            <button id="toggle-voice" class="btn" type="button">Голос</button>
          </div>
          <label class="muted-note">
            Порог автоспуска: <strong id="threshold-value">80%</strong>
            <input
              id="threshold-slider"
              type="range"
              min="60"
              max="95"
              value="80"
              style="width: 100%"
            />
          </label>
          <select id="camera-select" class="btn"></select>
          <div class="row-2">
            <button id="btn-manual-shutter" class="btn btn-primary" type="button">
              АВТО / Снять
            </button>
            <button id="btn-record-pose" class="btn" type="button">Запись 3с</button>
          </div>
          <div class="row-2">
            <button id="cam-btn-hub" class="btn" type="button">Хаб</button>
            <button id="cam-btn-calib" class="btn" type="button">Править позу</button>
          </div>
          <button id="cam-btn-gallery" class="btn" type="button">
            Галерея (<span id="cam-gallery-count">0</span>)
          </button>
        </div>
      </section>

      <section id="screen-gallery" class="screen" hidden>
        <div class="topbar">
          <button id="gal-btn-camera" class="btn" type="button">К съемке</button>
          <span id="gal-shot-score" class="status-pill">Пока нет снимков</span>
          <button id="gal-btn-hub" class="btn" type="button">Хаб</button>
        </div>
        <div class="side-by-side">
          <div class="compare-pane">
            <span class="muted-note">Эталон</span><canvas id="gal-ref-canvas"></canvas>
          </div>
          <div class="compare-pane">
            <span class="muted-note">Ваше фото</span><canvas id="gal-shot-canvas"></canvas>
          </div>
        </div>
        <div class="row-2">
          <button id="gal-toggle-skel" class="btn" type="button">Скелет поверх</button>
          <button id="gal-btn-download" class="btn btn-primary" type="button">Скачать JPG</button>
        </div>
        <div id="gal-strip" class="shots-strip"></div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
